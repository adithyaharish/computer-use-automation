name: Validate and collect evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      unit_count: ${{ steps.unit.outputs.count }}
      browser_count: ${{ steps.browser.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Unit and HTTP tests
        id: unit
        shell: bash
        run: |
          node --test --test-reporter=tap tests/*.test.js | tee "$RUNNER_TEMP/unit.tap"
          echo "count=$(awk '$1 == "#" && $2 == "tests" {print $3}' "$RUNNER_TEMP/unit.tap")" >> "$GITHUB_OUTPUT"
      - name: Real browser tests
        id: browser
        shell: bash
        run: |
          node --test --test-reporter=tap tests/browser.spec.js | tee "$RUNNER_TEMP/browser.tap"
          echo "count=$(awk '$1 == "#" && $2 == "tests" {print $3}' "$RUNNER_TEMP/browser.tap")" >> "$GITHUB_OUTPUT"
  live-evidence:
    permissions:
      contents: write
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Genuine discovery, replay, exceptions and handoff verification
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        run: node scripts/collect-evidence.js
      - name: Verify and publish successful evidence
        env:
          UNIT_TEST_COUNT: ${{ needs.test.outputs.unit_count }}
          BROWSER_TEST_COUNT: ${{ needs.test.outputs.browser_count }}
        shell: bash
        run: |
          node scripts/finalize-evidence.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json README.md REPORT.md evidence/
          git commit -m "Record verified discovery, replay and handoff evidence [skip ci]"
          git push origin HEAD:main
      - name: Preserve evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-evidence-${{ github.sha }}
          path: evidence/live-*/
          if-no-files-found: warn
          retention-days: 14
