<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Operator | Live session</title><style>
body{font:15px system-ui;background:#edf0f2;color:#193c33;margin:40px auto;max-width:920px}h1{font-size:32px}.card{padding:24px;background:white;border:1px solid #cbd9d0;margin:16px 0;border-radius:6px}button{padding:11px 18px;margin:5px;background:#205e47;color:white;border:0;border-radius:4px;cursor:pointer}button:disabled{opacity:.35}input{padding:10px;border:1px solid #aaa}pre{white-space:pre-wrap}.muted{color:#62746b}.error{color:#933}</style></head><body>
<p class="muted">CEDARCORE / AUTOMATION OPERATIONS</p><h1>Live session intervention</h1><p>This panel operates the automation's existing browser session. Control values stay private.</p>
<div class="card"><b id="owner">Connecting…</b><pre id="reason"></pre><button id="acquire">Take control</button><button id="resume">Return control & resume</button><button id="abort">Abort run</button></div>
<div class="card"><h2>Visible controls</h2><div id="controls"></div></div><p id="error" class="error"></p>
<script>
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);
async function api(route,body){const r=await fetch(route,{method:body?'POST':'GET',headers:{'X-Operator-Token':token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const v=await r.json();if(!r.ok)throw Error(v.error);return v;}
async function action(route,body={}){try{await api(route,body);document.getElementById('error').textContent='';await refresh();}catch(e){document.getElementById('error').textContent=e.message;}}
for(const x of ['acquire','resume','abort'])document.getElementById(x).onclick=()=>action('/'+x);
async function refresh(){try{const s=await api('/state');document.getElementById('owner').textContent='Control owner: '+s.owner;document.getElementById('reason').textContent=JSON.stringify(s.request,null,2);document.getElementById('acquire').disabled=s.owner!=='paused';document.getElementById('resume').disabled=s.owner!=='human';const box=document.getElementById('controls');box.replaceChildren();for(const c of s.state.controls){const row=document.createElement('p');row.textContent=c.label+' ';if(c.operatorActions?.includes('click')){const b=document.createElement('button');b.textContent='Click';b.disabled=s.owner!=='human';b.onclick=()=>action('/action',{action:'click',target:c.target});row.append(b);}if(c.operatorActions?.includes('fill')){const input=document.createElement('input');input.setAttribute('aria-label',c.label);const b=document.createElement('button');b.textContent='Enter value';b.disabled=s.owner!=='human';b.onclick=()=>action('/action',{action:'fill',target:c.target,value:input.value});row.append(input,b);}box.append(row);}}catch(e){document.getElementById('error').textContent=e.message;}}
refresh();setInterval(()=>{if(document.activeElement.tagName!=='INPUT')refresh();},1500);
</script></body></html>
